    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

    function tgHaptic(type = 'light') {
      try {
        if (tg && tg.HapticFeedback) {
          if (type === 'success' || type === 'warning' || type === 'error') {
            tg.HapticFeedback.notificationOccurred(type);
          } else {
            tg.HapticFeedback.impactOccurred(type);
          }
        }
      } catch (e) {}
    }

    function sendPayloadToBot(payloadObj, fallbackCopyText, notifyFn) {
      const jsonStr = JSON.stringify(payloadObj);
      if (tg && typeof tg.sendData === 'function' && tg.initData) {
        try {
          tgHaptic('success');
          tg.sendData(jsonStr);
          return true;
        } catch (e) {
          console.warn('tg.sendData error:', e);
        }
      }
      copyToClipboard(fallbackCopyText || jsonStr);
      tgHaptic('medium');
      if (notifyFn) {
        notifyFn('Скопировано в буфер (открыто вне кнопки клавиатуры бота)');
      }
      return false;
    }

    // =========================================================================
    // 1. ХРАНИЛИЩЕ И УТИЛИТЫ (ТОЧНОЕ СОХРАНЕНИЕ НОМЕРОВ И ДАТ ИЗ ФАЙЛА + ПОИСК)
    // =========================================================================
    const STORAGE_KEY = 'tab_workspace_v2_result6_verified_phones';
    const ACCOUNTING_SEED_VERSION = 'result6_verified_phones_v1';

    // Сохраняет точное написание номера из исходного файла (только убирая лишние краевые пробелы)
    function exactPhoneFromFile(raw) {
      return String(raw || '').trim();
    }

    // Приводит номер и поисковый запрос к единому виду без пробелов, неразрывных пробелов и любых тире/дефисов
    function searchKeyPhone(raw) {
      return String(raw || '')
        .replace(/[\s\u00a0\u2000-\u200b\u202f\u205f\u3000\u2010-\u2015\u2212()-]/g, '')
        .toLowerCase();
    }

    // Извлекает только цифры для совпадения по любым фрагментам цифр
    function normalizePhone(raw) {
      return String(raw || '').replace(/[^\d]/g, '');
    }

    // Возвращает номер в точном виде, как он записан в файле
    function formatPhoneDisplay(raw) {
      return exactPhoneFromFile(raw);
    }

    // Универсальная проверка совпадения поискового запроса с номером
    function phoneMatchesQuery(phoneValue, rawQuery) {
      const q = String(rawQuery || '').trim();
      if (!q) return true;
      const phoneExact = String(phoneValue || '').toLowerCase();
      const qLower = q.toLowerCase();
      if (phoneExact.includes(qLower)) return true;

      const phoneKey = searchKeyPhone(phoneValue);
      const qKey = searchKeyPhone(q);
      if (qKey && phoneKey.includes(qKey)) return true;

      const phoneDigits = normalizePhone(phoneValue);
      const qDigits = normalizePhone(q);
      if (qDigits && phoneDigits.includes(qDigits)) return true;

      return false;
    }

    function todayFormatted() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      return `${dd}.${mm}.${yyyy}`;
    }

    function copyToClipboard(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).catch(() => {});
        }
      } catch (e) {}
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
      } catch (err) {
        console.error('Ошибка копирования:', err);
      }
      document.body.removeChild(ta);
    }

    // Подсчёт сводных сумм по валютам из списка записей с защитой от ошибок с плавающей точкой
    function parseAmountFromPriceText(priceText, explicitAmount, explicitCurrency) {
      const text = String(priceText || '').trim();
      const lower = text.toLowerCase();

      let currency = explicitCurrency;
      if (!currency) {
        if (lower.includes('€') || lower.includes('eur') || lower.includes('евро')) {
          currency = 'EUR';
        } else if (lower.includes('$') || lower.includes('usd') || lower.includes('долл') || lower.includes('бакс')) {
          currency = 'USD';
        } else if (lower.includes('rsd') || lower.includes('динар')) {
          currency = 'RSD';
        } else {
          currency = 'GEL';
        }
      }

      if (typeof explicitAmount === 'number' && Number.isFinite(explicitAmount) && explicitAmount > 0) {
        return { amount: Math.round(explicitAmount * 100) / 100, currency };
      }

      const match = text.match(/(\d+(?:[.,]\d+)?)/);
      const rawNum = match ? Number(match[1].replace(',', '.')) : 0;
      const cleanNum = Number.isFinite(rawNum) ? Math.round(rawNum * 100) / 100 : 0;
      return { amount: cleanNum, currency };
    }

    function computeCashStats(list) {
      const totals = { GEL: 0, USD: 0, EUR: 0, RSD: 0 };
      const items = Array.isArray(list) ? list : [];

      items.forEach((item) => {
        const parsed = parseAmountFromPriceText(item.priceText, item.amountNum, item.currency);
        if (!Object.prototype.hasOwnProperty.call(totals, parsed.currency)) {
          totals[parsed.currency] = 0;
        }
        const prevCents = Math.round(totals[parsed.currency] * 100);
        const addCents = Math.round(parsed.amount * 100);
        totals[parsed.currency] = (prevCents + addCents) / 100;
      });

      const formatVal = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/\.?0+$/, ''));

      return {
        gelSum: totals.GEL || 0,
        usdSum: totals.USD || 0,
        eurSum: totals.EUR || 0,
        rsdSum: totals.RSD || 0,
        totals,
        count: items.length,
        summaryLine: [
          totals.GEL ? `${formatVal(totals.GEL)} GEL` : '0 GEL',
          totals.USD ? `${formatVal(totals.USD)}$` : '0$',
          totals.EUR ? `${formatVal(totals.EUR)}€` : null,
          totals.RSD ? `${formatVal(totals.RSD)} RSD` : null
        ]
          .filter(Boolean)
          .join(' • ')
      };
    }

    // Парсер записей из экспорта чата «Бухгалтерия» с сохранением точного написания номера клиента и даты из файла
    function parseAccountingExportText(rawText) {
      const src = String(rawText || '').trim();
      if (!src) return [];

      const normalized = src.replace(/\r\n/g, '\n');
      const rawBlocks = normalized.includes('Дата:')
        ? normalized.split(/(?=^Дата:\s*)/gm).map((b) => b.trim()).filter(Boolean)
        : normalized.split(/\n={3,}\n|\n-{3,}\n|\n\s*\n/).map((b) => b.trim()).filter(Boolean);

      const results = [];
      rawBlocks.forEach((block, idx) => {
        const dateMatch = block.match(/Дата:\s*([^\n]+)/i);
        const modelMatch = block.match(/Модель:\s*([^\n]+)/i);
        const durMatch = block.match(/Продолжительность:\s*([^\n]+)/i);
        const priceMatch = block.match(/Прайс:\s*([^\n]+)/i);
        const opMatch = block.match(/Оператор:\s*([^\n]+)/i);
        const phoneMatch = block.match(/Номер клиента:\s*([\s\S]*?)(?=\n\s*Отзыв о Клиенте:|\n\s*Дата:|$)/i);
        const reviewMatch = block.match(/Отзыв о Клиенте:\s*([\s\S]*?)(?=\n\s*Дата:|$)/i);

        if (!priceMatch && !modelMatch && !dateMatch) return;

        const priceText = (priceMatch ? priceMatch[1] : '').trim() || '0 GEL';
        const parsedAmt = parseAmountFromPriceText(priceText, null, null);
        const dateStr = (dateMatch ? dateMatch[1] : '').trim() || todayFormatted();
        const exactPhone = exactPhoneFromFile(phoneMatch ? phoneMatch[1] : '');

        results.push({
          id: `bk-imp-${Date.now()}-${idx}-${Math.random().toString(36).slice(2, 6)}`,
          date: dateStr,
          bookingDate: dateStr,
          model: (modelMatch ? modelMatch[1] : '').trim() || 'Без имени',
          duration: (durMatch ? durMatch[1] : '').trim() || '—',
          priceText,
          amountNum: parsedAmt.amount,
          currency: parsedAmt.currency,
          operator: (opMatch ? opMatch[1] : '').trim() || 'Оператор',
          timeSlot: '',
          clientPhone: exactPhone,
          review: (reviewMatch ? reviewMatch[1] : '').trim(),
          address: 'Тбилиси'
        });
      });

      return results;
    }

    // Главный экран быстрой проверки клиента и поиска по номерам
    function HomeView({ blacklist, bookings, models, operators, onNavigate, onCopy, onQuickAddBlacklist, onRunCreation }) {
      const [query, setQuery] = useState('');
      const [quickTag, setQuickTag] = useState('Неадекват');
      const [quickNote, setQuickNote] = useState('');

      const normalizedQuery = normalizePhone(query);

      const blacklistMatches = useMemo(() => {
        if (!query.trim()) return [];
        const qLower = query.trim().toLowerCase();
        return blacklist.filter((item) => {
          const phoneOk = phoneMatchesQuery(item.phone, query);
          const textMatch =
            item.reason.toLowerCase().includes(qLower) ||
            item.tag.toLowerCase().includes(qLower) ||
            item.addedBy.toLowerCase().includes(qLower);
          return phoneOk || textMatch;
        });
      }, [blacklist, query]);

      const bookingPhoneMatches = useMemo(() => {
        if (!query.trim()) return [];
        const qLower = query.trim().toLowerCase();
        return (bookings || []).filter((bk) => {
          const phoneOk = phoneMatchesQuery(bk.clientPhone, query);
          const textMatch =
            String(bk.model || '').toLowerCase().includes(qLower) ||
            String(bk.operator || '').toLowerCase().includes(qLower) ||
            String(bk.bookingDate || bk.date || '').toLowerCase().includes(qLower) ||
            String(bk.review || '').toLowerCase().includes(qLower);
          return phoneOk || textMatch;
        });
      }, [bookings, query]);

      const hasInput = query.trim().length > 0;
      const isFound = blacklistMatches.length > 0 || bookingPhoneMatches.length > 0;
      const activeModelsCount = models.filter((m) => m.status === 'Активна').length;

      const handleQuickBlock = (e) => {
        e.preventDefault();
        if (!query.trim()) return;
        const exactPhone = exactPhoneFromFile(query);
        onRunCreation('ЗАПИСЬ В ЧС', `Добавляем ${exactPhone} в базу...`, () => {
          onQuickAddBlacklist({
            phone: exactPhone,
            tag: quickTag,
            reason: quickNote.trim() || 'Добавлено через быструю проверку на смене',
            addedBy: 'Оператор TAB',
            date: todayFormatted()
          });
          setQuickNote('');

    // Модальное окно сводки по периодам и быстрых действий шапки
    function OverflowMenuModal({
      open,

      onAddBooking,
      onCopy,
      onRunCreation,
      onNavigate,
      onCustomLogoClick,
      customLogo,
      onResetCustomLogo

      const [period, setPeriod] = useState('today');
      const [quickModel, setQuickModel] = useState('Мила / Mila');
      const [quickPrice, setQuickPrice] = useState('700 GEL');
      const [quickOp, setQuickOp] = useState('Eva');

      const todayStr = todayFormatted();
      const periodBookings = useMemo(() => {
        const list = Array.isArray(bookings) ? bookings : [];
        if (period === 'today') {
          return list.filter((b) => (b.bookingDate || b.date) === todayStr);
        }
        if (period === 'export_day') {
          return list.filter((b) => (b.bookingDate || b.date) === '09.04.2026');
        }
        return list;
      }, [bookings, period, todayStr]);

      const stats = useMemo(() => computeCashStats(periodBookings), [periodBookings]);

      if (!open) return null;

      const summaryText = [
        `TABU • Сводка (${period === 'today' ? `Сегодня ${todayStr}` : period === 'export_day' ? 'Бронь 09.04.2026' : 'Все записи'})`,
        `Записей: ${stats.count}`,
        `Итого: ${stats.summaryLine}`
      ].join('\n');

      const handleQuickEntry = (e) => {
        e.preventDefault();
        if (!quickModel.trim()) return;
        const parsedAmt = parseAmountFromPriceText(quickPrice, null, null);
        onRunCreation('БЫСТРАЯ ЗАПИСЬ', `Добавляем ${quickModel.trim()} в кассу...`, () => {
          onAddBooking({
            id: `bk-${Date.now()}`,
            date: todayStr,
            bookingDate: todayStr,
            model: quickModel.trim(),
            duration: '1 час',
            priceText: quickPrice.trim() || '0 GEL',
            amountNum: parsedAmt.amount,
            currency: parsedAmt.currency,
            operator: quickOp.trim() || 'Оператор',
            timeSlot: new Date().toTimeString().slice(0, 5),
            clientPhone: '',
            review: 'Быстрая запись из меню сводки',
            address: 'Тбилиси'
          });

              h('button', {

                onClick: () => setPeriod(p.id),

    // =========================================================================
    function BlacklistView({ blacklist, onAdd, onDelete, onCopy, onRunCreation }) {
      const [search, setSearch] = useState('');
      const [tagFilter, setTagFilter] = useState('Все');
      const [phone, setPhone] = useState('');
      const [tag, setTag] = useState('Неадекват');
      const [reason, setReason] = useState('');
      const [addedBy, setAddedBy] = useState('Eva');

      const tags = ['Все', 'Неадекват', 'Фейк', 'Точечный ЧС', 'Опасно', 'ЧС'];

      const filteredList = useMemo(() => {
        const lower = search.trim().toLowerCase();
        return blacklist.filter((item) => {
          const tagOk = tagFilter === 'Все' || item.tag === tagFilter;
          if (!tagOk) return false;
          if (!search.trim()) return true;
          return (
            phoneMatchesQuery(item.phone, search) ||
            item.reason.toLowerCase().includes(lower) ||
            item.addedBy.toLowerCase().includes(lower)
          );
        });
      }, [blacklist, search, tagFilter]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!phone.trim() || !reason.trim()) return;
        const exactPhone = exactPhoneFromFile(phone);
        onRunCreation('ДОБАВЛЕНИЕ В ЧС', `Сохраняем номер ${exactPhone}...`, () => {
          onAdd({
            phone: exactPhone,
            reason: reason.trim(),
            tag,
            addedBy: addedBy.trim() || 'Оператор TAB',
            date: todayFormatted()
          });
          setPhone('');
          setReason('');
        });
      };

      return h('div', { className: 'space-y-6' },
        h('section', { className: 'glass-panel rounded-[8px] p-5' },

                        type: 'button',
                        onClick: () => onDelete(item.id),
                        className: 'btn-press glass-field px-2.5 py-1.5 rounded-[8px] hover:border-crimson-600 text-xs text-zinc-400 hover:text-crimson-500'
                      }, 'Удалить')
                    )
                  )
                )
              )
        )
      );
    }

    // =========================================================================
    // 6. МОДУЛЬ 3: МОДЕЛИ И КАРТОЧКИ ДЛЯ КЛИЕНТА
    // =========================================================================
    function ModelsView({ models, onAddModel, onUpdateModel, onDeleteModel, onCopy, onRunCreation }) {
      const [selectedId, setSelectedId] = useState(models[0]?.id || null);
      const [showAddForm, setShowAddForm] = useState(false);
      const [activePhotoIndex, setActivePhotoIndex] = useState(0);
      const [lightboxOpen, setLightboxOpen] = useState(false);
      const [searchModel, setSearchModel] = useState('');
      const [newModel, setNewModel] = useState({
        name: '',
        age: '20',
        height: '170',
        weight: '52',
        bust: '—',
        status: 'Активна',
        incall: '30 мин — 500 GEL / 1 ч — 700 GEL',
        outcall: '1 ч — 1000 GEL / 2 ч — 1500 GEL / 3 ч — 3000 GEL',
        fullNight: 'По договорённости',
        services: 'Массаж, минет без резинки, секс, GFE',
        extras: '',
        address: 'Тбилиси',
        intercom: '',
        mapUrl: '',
        internalNote: '',
        photoDataUrl: '',
        photos: []
      });

      const filteredModels = useMemo(() => {
        const q = searchModel.trim().toLowerCase();
        if (!q) return models;
        return models.filter(
          (m) =>
            String(m.name || '').toLowerCase().includes(q) ||
            String(m.address || '').toLowerCase().includes(q) ||
            String(m.services || '').toLowerCase().includes(q)
        );
      }, [models, searchModel]);

      const selectedModel = useMemo(
        () =>
          models.find((m) => m.id === selectedId) ||
          filteredModels[0] ||
          models[0] ||
          null,
        [models, filteredModels, selectedId]
      );

      const getModelPhotos = (m) => {
        if (!m) return [];
        const list = Array.isArray(m.photos) ? m.photos.filter(Boolean) : [];
        if (list.length > 0) return list;
        if (m.photoDataUrl) return [m.photoDataUrl];
        return [];
      };

      const selectedPhotos = useMemo(() => getModelPhotos(selectedModel), [selectedModel]);
      const newModelPhotos = useMemo(() => getModelPhotos(newModel), [newModel]);

      useEffect(() => {
        setActivePhotoIndex(0);
        setLightboxOpen(false);
      }, [selectedId, selectedPhotos.length]);

      const readFileAsCompressedDataUrl = (file, maxSide = 1280, quality = 0.84) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => {
            const rawUrl = String(reader.result || '');
            const img = new Image();
            img.onload = () => {
              let { width, height } = img;
              if (width > maxSide || height > maxSide) {
                if (width >= height) {
                  height = Math.round((height * maxSide) / width);
                  width = maxSide;
                } else {
                  width = Math.round((width * maxSide) / height);
                  height = maxSide;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              if (ctx) {
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
              } else {
                resolve(rawUrl);
              }
            };
            img.onerror = () => resolve(rawUrl);
            img.src = rawUrl;
          };
          reader.onerror = () => resolve('');
          reader.readAsDataURL(file);
        });
      };

      const handlePhotoUpload = async (e, targetMode) => {
        const files = Array.from((e.target && e.target.files) || []);
        e.target.value = '';
        if (files.length === 0) return;

        const uploadedUrls = (
          await Promise.all(files.map((file) => readFileAsCompressedDataUrl(file)))
        ).filter(Boolean);

        if (uploadedUrls.length === 0) return;

        if (targetMode === 'new') {
          setNewModel((prev) => {
            const existing = getModelPhotos(prev);
            const merged = [...existing, ...uploadedUrls];
            return {
              ...prev,
              photos: merged,
              photoDataUrl: merged[0] || ''
            };
          });
        } else if (selectedModel) {
          const existing = getModelPhotos(selectedModel);
          const merged = [...existing, ...uploadedUrls];
          onUpdateModel({
            ...selectedModel,
            photos: merged,
            photoDataUrl: merged[0] || ''
          });
          setActivePhotoIndex(existing.length);
        }
      };

      const handleRemovePhoto = (indexToRemove, targetMode) => {
        if (targetMode === 'new') {
          setNewModel((prev) => {
            const existing = getModelPhotos(prev);
            const nextList = existing.filter((_, idx) => idx !== indexToRemove);
            return {
              ...prev,
              photos: nextList,
              photoDataUrl: nextList[0] || ''
            };
          });
        } else if (selectedModel) {
          const existing = getModelPhotos(selectedModel);
          const nextList = existing.filter((_, idx) => idx !== indexToRemove);
          onUpdateModel({
            ...selectedModel,
            photos: nextList,
            photoDataUrl: nextList[0] || ''
          });
          setActivePhotoIndex((prevIdx) => {
            if (nextList.length === 0) return 0;
            return Math.min(prevIdx, nextList.length - 1);
          });
        }
      };

      const handleClearAllPhotos = () => {
        if (!selectedModel) return;
        onUpdateModel({
          ...selectedModel,
          photos: [],
          photoDataUrl: ''
        });
        setActivePhotoIndex(0);
        setLightboxOpen(false);
      };

      const handleDownloadPhoto = (model, photoIdx = 0) => {
        const list = getModelPhotos(model);
        const targetUrl = list[photoIdx] || list[0];
        if (!model || !targetUrl) return;
        const link = document.createElement('a');
        link.href = targetUrl;
        link.download = `${model.name || 'model'}-photo-${photoIdx + 1}.jpg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const buildClientCardText = (m) => {
        return [
          `${m.name}, ${m.age} лет`,
          `Рост / вес${m.bust && m.bust !== '—' ? ' / грудь' : ''}: ${m.height} см / ${m.weight} кг${m.bust && m.bust !== '—' ? ` / ${m.bust}` : ''}`,
          `Incall: ${m.incall}`,
          `Outcall: ${m.outcall}`,
          m.fullNight && m.fullNight !== 'По договорённости' ? `Ночь: ${m.fullNight}` : null,
          `В встречу входит: ${m.services}`,
          m.extras ? `Допы: ${m.extras}` : null,
          `Адрес: ${m.address}`,
          m.mapUrl ? `Локация: ${m.mapUrl}` : null
        ]
          .filter(Boolean)
          .join('\n');
      };

      const handleCreateModel = (e) => {
        e.preventDefault();
        if (!newModel.name.trim()) return;
        const finalPhotos = getModelPhotos(newModel);
        const created = {
          ...newModel,
          id: `m-${Date.now()}`,
          age: Number(newModel.age) || 20,
          height: Number(newModel.height) || 170,
          weight: Number(newModel.weight) || 52,
          photos: finalPhotos,
          photoDataUrl: finalPhotos[0] || ''
        };
        onRunCreation('СОЗДАНИЕ АНКЕТЫ', `Собираем карточку ${created.name}...`, () => {
          onAddModel(created);
          setSelectedId(created.id);
          setShowAddForm(false);
          setNewModel({
            name: '',
            age: '20',
            height: '170',
            weight: '52',
            bust: '—',
            status: 'Активна',
            incall: '30 мин — 500 GEL / 1 ч — 700 GEL',
            outcall: '1 ч — 1000 GEL / 2 ч — 1500 GEL / 3 ч — 3000 GEL',
            fullNight: 'По договорённости',
            services: 'Массаж, минет без резинки, секс, GFE',
            extras: '',
            address: 'Тбилиси',
            intercom: '',
            mapUrl: '',
            internalNote: '',
            photoDataUrl: '',
            photos: []
          });
        });
      };

      const currentPhotoSrc = selectedPhotos[activePhotoIndex] || selectedPhotos[0] || '';

      return h('div', { className: 'space-y-4 sm:space-y-5' },
        h('div', { className: 'glass-panel rounded-[10px] p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5' },
          h('div', { className: 'flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5 flex-1' },
            filteredModels.map((m) => {
              const active = selectedModel && selectedModel.id === m.id;
              const mCount = getModelPhotos(m).length;
              return h('button', {
                key: m.id,
                type: 'button',
                onClick: () => {
                  tgHaptic('light');
                  setSelectedId(m.id);
                  setShowAddForm(false);
                },
                className: `btn-press px-3 py-1.5 rounded-[8px] text-xs font-semibold whitespace-nowrap border flex items-center gap-1.5 ${
                  active
                    ? 'bg-crimson-700 border-crimson-500 text-white shadow-sm'
                    : 'glass-field text-zinc-300 hover:text-white'
                }`
              },
                h('span', {
                  className: `w-1.5 h-1.5 rounded-full ${m.status === 'Активна' ? 'bg-emerald-400' : 'bg-amber-400'}`
                }),
                h('span', null, m.name),
                mCount > 0 && h('span', {
                  className: `px-1.5 py-0.2 rounded text-[10px] font-bold ${
                    active ? 'bg-black/35 text-white' : 'bg-crimson-900/60 text-crimson-500'
                  }`
                }, mCount)
              );
            })
          ),

          h('div', { className: 'flex items-center gap-2 shrink-0' },
            h('input', {
              type: 'text',
              value: searchModel,
              onChange: (e) => setSearchModel(e.target.value),
              placeholder: 'Поиск модели...',
              className: 'glass-field rounded-[8px] px-3 py-1.5 text-xs text-white placeholder-zinc-400 outline-none focus:border-crimson-600 w-32 sm:w-40'
            }),
            h('button', {
              type: 'button',
              onClick: () => setShowAddForm((prev) => !prev),
              className: 'btn-press px-3 py-1.5 rounded-[8px] bg-crimson-700 hover:bg-crimson-600 text-xs font-semibold text-white whitespace-nowrap'
            }, showAddForm ? 'Закрыть' : '+ Модель')
          )
        ),

        showAddForm && h('section', { className: 'glass-panel rounded-[10px] p-4 sm:p-5' },
          h('h3', { className: 'font-brand-brush text-sm sm:text-base text-white uppercase mb-3' }, 'НОВАЯ КАРТОЧКА МОДЕЛИ'),
          h('form', { onSubmit: handleCreateModel, className: 'grid grid-cols-1 sm:grid-cols-3 gap-3' },
            h('input', {
              type: 'text',
              required: true,
              value: newModel.name,
              onChange: (e) => setNewModel({ ...newModel, name: e.target.value }),
              placeholder: 'Имя модели',
              className: 'glass-field rounded-[8px] px-3 py-2 text-sm text-white outline-none focus:border-crimson-600'
            }),
            h('input', {
              type: 'number',
              value: newModel.age,
              onChange: (e) => setNewModel({ ...newModel, age: e.target.value }),
              placeholder: 'Возраст',
              className: 'glass-field rounded-[8px] px-3 py-2 text-sm text-white outline-none focus:border-crimson-600'
            }),
            h('select', {
              value: newModel.status,
              onChange: (e) => setNewModel({ ...newModel, status: e.target.value }),
              className: 'glass-field rounded-[8px] px-3 py-2 text-sm text-white outline-none focus:border-crimson-600'
            },
              h('option', { value: 'Активна' }, 'Активна'),
              h('option', { value: 'На заказе' }, 'На заказе')
            ),
            h('input', {
              type: 'number',
              value: newModel.height,
              onChange: (e) => setNewModel({ ...newModel, height: e.target.value }),
              placeholder: 'Рост (см)',
              className: 'glass-field rounded-[8px] px-3 py-2 text-sm text-white outline-none'
            }),
            h('input', {
              type: 'number',
              value: newModel.weight,
              onChange: (e) => setNewModel({ ...newModel, weight: e.target.value }),
              placeholder: 'Вес (кг)',
              className: 'glass-field rounded-[8px] px-3 py-2 text-sm text-white outline-none'
            }),
            h('input', {
              type: 'text',
              value: newModel.bust,
              onChange: (e) => setNewModel({ ...newModel, bust: e.target.value }),
              placeholder: 'Грудь (или —)',
              className: 'glass-field rounded-[8px] px-3 py-2 text-sm text-white outline-none'
            }),
            h('input', {
              type: 'text',
              value: newModel.incall,
              onChange: (e) => setNewModel({ ...newModel, incall: e.target.value }),
              placeholder: 'Прайс Incall',
              className: 'glass-field rounded-[8px] px-3 py-2 text-sm text-white outline-none'
            }),
            h('input', {
              type: 'text',
              value: newModel.outcall,
              onChange: (e) => setNewModel({ ...newModel, outcall: e.target.value }),
              placeholder: 'Прайс Outcall',
              className: 'glass-field rounded-[8px] px-3 py-2 text-sm text-white outline-none'
            }),
            h('input', {
              type: 'text',
              value: newModel.address,
              onChange: (e) => setNewModel({ ...newModel, address: e.target.value }),
              placeholder: 'Адрес',
              className: 'glass-field rounded-[8px] px-3 py-2 text-sm text-white outline-none'
            }),
            h('textarea', {
              rows: '2',
              value: newModel.services,
              onChange: (e) => setNewModel({ ...newModel, services: e.target.value }),
              placeholder: 'В встречу входит',
              className: 'glass-field sm:col-span-3 rounded-[8px] px-3 py-2 text-sm text-white outline-none'
            }),

            newModelPhotos.length > 0 && h('div', { className: 'sm:col-span-3 flex items-center gap-2 overflow-x-auto no-scrollbar py-1' },
              newModelPhotos.map((srcImg, idx) =>
                h('div', {
                  key: idx,
                  className: 'relative w-12 h-14 rounded-[6px] overflow-hidden border border-hairline shrink-0'
                },
                  h('img', {
                    src: srcImg,
                    alt: `new-${idx + 1}`,
                    className: 'w-full h-full object-cover'
                  }),
                  h('button', {
                    type: 'button',
                    onClick: () => handleRemovePhoto(idx, 'new'),
                    className: 'btn-press absolute top-0.5 right-0.5 w-4 h-4 rounded-full bg-black/80 text-white text-[9px] flex items-center justify-center hover:bg-crimson-600'
                  }, '✕')
                )
              )
            ),

            h('div', { className: 'sm:col-span-3 flex flex-wrap items-center justify-between gap-3 pt-1' },
              h('label', { className: 'btn-press glass-field cursor-pointer px-3.5 py-2 rounded-[8px] hover:border-crimson-600 text-xs text-zinc-200' },
                newModelPhotos.length > 0 ? `Добавить ещё фото (${newModelPhotos.length})` : '+ Загрузить фото (можно несколько)',
                h('input', {
                  type: 'file',
                  accept: 'image/*',
                  multiple: true,
                  onChange: (e) => handlePhotoUpload(e, 'new'),
                  className: 'hidden'
                })
              ),
              h('button', {
                type: 'submit',
                className: 'btn-press px-5 py-2 rounded-[8px] bg-crimson-700 hover:bg-crimson-600 text-white text-sm font-semibold'
              }, 'Создать карточку')
            )
          )
        ),

        selectedModel && h('section', { className: 'glass-panel rounded-[10px] p-4 sm:p-5' },
          h('div', { className: 'flex flex-col md:flex-row gap-5 items-start' },
            h('div', { className: 'w-full md:w-[230px] lg:w-[250px] shrink-0 space-y-2.5' },
              h('div', {
                onClick: () => currentPhotoSrc && setLightboxOpen(true),
                className: `glass-field relative w-full h-[230px] sm:h-[250px] rounded-[10px] overflow-hidden flex items-center justify-center ${
                  currentPhotoSrc ? 'cursor-zoom-in group' : ''
                }`
              },
                currentPhotoSrc
                  ? h('img', {
                      src: currentPhotoSrc,
                      alt: `${selectedModel.name} — фото ${activePhotoIndex + 1}`,
                      className: 'w-full h-full object-cover object-top transition-transform duration-200 group-hover:scale-[1.03]',
                      onError: (e) => {
                        e.currentTarget.style.display = 'none';
                      }
                    })
                  : h('div', { className: 'text-center p-4 space-y-1.5' },
                      h('p', { className: 'font-brand-brush text-base text-crimson-500' }, selectedModel.name),
                      h('p', { className: 'text-[11px] text-zinc-400 leading-snug' }, 'Фото не прикреплены. Нажмите «+ Фото» для загрузки.')
                    ),

                selectedPhotos.length > 0 && h('span', {
                  className: 'absolute top-2 left-2 px-2 py-0.5 rounded bg-obsidian/80 border border-hairline text-[10px] font-bold text-white'
                }, `${activePhotoIndex + 1}/${selectedPhotos.length}`),

                currentPhotoSrc && h('span', {
                  className: 'absolute bottom-2 right-2 px-2 py-0.5 rounded bg-obsidian/80 border border-hairline text-[10px] text-zinc-200'
                }, 'Увеличить'),

                selectedPhotos.length > 1 && h('button', {
                  type: 'button',
                  onClick: (e) => {
                    e.stopPropagation();
                    setActivePhotoIndex((prev) => (prev - 1 + selectedPhotos.length) % selectedPhotos.length);
                  },
                  title: 'Назад',
                  className: 'btn-press absolute left-1.5 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-obsidian/80 border border-hairline text-white text-sm flex items-center justify-center hover:border-crimson-600'
                }, '‹'),

                selectedPhotos.length > 1 && h('button', {
                  type: 'button',
                  onClick: (e) => {
                    e.stopPropagation();
                    setActivePhotoIndex((prev) => (prev + 1) % selectedPhotos.length);
                  },
                  title: 'Вперёд',
                  className: 'btn-press absolute right-1.5 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-obsidian/80 border border-hairline text-white text-sm flex items-center justify-center hover:border-crimson-600'
                }, '›')
              ),

              selectedPhotos.length > 0 && h('div', { className: 'flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5' },
                selectedPhotos.map((pUrl, idx) => {
                  const isCurrent = idx === activePhotoIndex;
                  return h('div', {
                    key: idx,
                    className: `relative w-11 h-11 rounded-[6px] overflow-hidden shrink-0 border transition ${
                      isCurrent ? 'border-crimson-500 ring-1 ring-crimson-500' : 'border-hairline opacity-70 hover:opacity-100'

                  },
                    h('button', {
                      type: 'button',
                      onClick: () => setActivePhotoIndex(idx),
                      className: 'w-full h-full block'
                    },
                      h('img', {
                        src: pUrl,
                        alt: `thumb-${idx + 1}`,
                        className: 'w-full h-full object-cover object-top'
                      })
                    ),
                    h('button', {
                      type: 'button',
                      onClick: () => handleRemovePhoto(idx, 'current'),
                      title: 'Удалить фото',
                      className: 'btn-press absolute top-0.5 right-0.5 w-3.5 h-3.5 rounded-full bg-black/85 text-white text-[8px] flex items-center justify-center hover:bg-crimson-600'
                    }, '✕')
                  );
                })
              ),

              h('div', { className: 'flex flex-wrap items-center gap-1.5' },
                h('label', { className: 'btn-press glass-field flex-1 text-center cursor-pointer px-2.5 py-1.5 rounded-[7px] hover:border-crimson-600 text-[11px] font-semibold text-white whitespace-nowrap' },
                  selectedPhotos.length > 0 ? '+ Фото' : '+ Загрузить фото',
                  h('input', {
                    type: 'file',
                    accept: 'image/*',
                    multiple: true,
                    onChange: (e) => handlePhotoUpload(e, 'current'),
                    className: 'hidden'
                  })
                ),
                selectedPhotos.length > 0 && h('button', {
                  type: 'button',
                  onClick: () => handleDownloadPhoto(selectedModel, activePhotoIndex),
                  className: 'btn-press glass-field px-2.5 py-1.5 rounded-[7px] hover:border-zinc-500 text-[11px] text-zinc-200'
                }, 'Скачать'),
                selectedPhotos.length > 1 && h('button', {
                  type: 'button',
                  onClick: handleClearAllPhotos,
                  className: 'btn-press glass-field px-2 py-1.5 rounded-[7px] hover:border-crimson-600 text-[11px] text-zinc-400 hover:text-crimson-500'
                }, 'Очистить'),
                models.length > 1 && h('button', {
                  type: 'button',
                  onClick: () => onDeleteModel(selectedModel.id),
                  className: 'btn-press glass-field px-2 py-1.5 rounded-[7px] hover:border-crimson-600 text-[11px] text-zinc-400 hover:text-crimson-500'
                }, 'Удалить')
              )
            ),

            h('div', { className: 'flex-1 min-w-0 w-full space-y-3.5' },
              h('div', { className: 'flex flex-wrap items-center justify-between gap-2.5 border-b border-hairline pb-3' },
                h('div', { className: 'space-y-1' },
                  h('h2', { className: 'text-lg sm:text-xl font-extrabold text-white leading-tight' }, selectedModel.name),
                  h('div', { className: 'flex flex-wrap items-center gap-1.5 text-[11px] text-zinc-300' },
                    h('span', { className: 'px-2 py-0.5 rounded bg-elevated/80 border border-hairline' }, `${selectedModel.age} лет`),
                    h('span', { className: 'px-2 py-0.5 rounded bg-elevated/80 border border-hairline' }, `${selectedModel.height} см`),
                    h('span', { className: 'px-2 py-0.5 rounded bg-elevated/80 border border-hairline' }, `${selectedModel.weight} кг`),
                    selectedModel.bust && selectedModel.bust !== '—' && h('span', { className: 'px-2 py-0.5 rounded bg-elevated/80 border border-hairline' }, `Грудь ${selectedModel.bust}`),
                    selectedPhotos.length > 0 && h('span', { className: 'px-2 py-0.5 rounded bg-crimson-900/40 border border-crimson-700/50 text-crimson-500 font-semibold' }, `${selectedPhotos.length} фото`)
                  )
                ),

                h('button', {
                  type: 'button',
                  onClick: () => {
                    tgHaptic('light');
                    onUpdateModel({
                      ...selectedModel,
                      status: selectedModel.status === 'Активна' ? 'На заказе' : 'Активна'
                    });
                  },
                  className: `btn-press px-3 py-1.5 rounded-[8px] text-xs font-bold border shrink-0 ${
                    selectedModel.status === 'Активна'
                      ? 'bg-emerald-950/60 border-emerald-700 text-emerald-300'
                      : 'bg-crimson-900/50 border-crimson-600 text-white'
                  }`
                }, selectedModel.status)
              ),

              h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-2.5' },
                h('div', { className: 'glass-field rounded-[8px] p-2.5' },
                  h('p', { className: 'text-[10px] uppercase tracking-wider text-zinc-400 font-semibold' }, 'Incall'),
                  h('p', { className: 'text-xs sm:text-sm text-white font-bold mt-0.5 leading-snug' }, selectedModel.incall)
                ),
                h('div', { className: 'glass-field rounded-[8px] p-2.5' },
                  h('p', { className: 'text-[10px] uppercase tracking-wider text-zinc-400 font-semibold' }, 'Outcall'),
                  h('p', { className: 'text-xs sm:text-sm text-white font-bold mt-0.5 leading-snug' }, selectedModel.outcall)
                )
              ),

              h('div', { className: 'glass-field rounded-[8px] p-3 space-y-2 text-xs sm:text-[13px]' },

    function AccountingView({ bookings, onAddBooking, onImportBookings, onClearBookings, onCopy, onRunCreation, notify }) {
      const [bDate, setBDate] = useState(todayFormatted());
      const [bBookingDate, setBBookingDate] = useState(todayFormatted());
      const [bModel, setBModel] = useState('Мила / Mila');
      const [bDuration, setBDuration] = useState('1 час');
      const [bPrice, setBPrice] = useState('700 GEL');
      const [bOperator, setBOperator] = useState('Eva');
      const [bTime, setBTime] = useState('18:00');
      const [bClientPhone, setBClientPhone] = useState('');
      const [bReview, setBReview] = useState('');
      const [bAddress, setBAddress] = useState('57 Beri Gabriel Salosi Avenue');

      const [periodPreset, setPeriodPreset] = useState('all');
      const [filterDate, setFilterDate] = useState('');
      const [selectedIds, setSelectedIds] = useState([]);
      const [calcResult, setCalcResult] = useState(null);
      const [showImportBox, setShowImportBox] = useState(false);
      const [importRawText, setImportRawText] = useState('');

      const todayStr = todayFormatted();

      const filteredBookings = useMemo(() => {
        const list = Array.isArray(bookings) ? bookings : [];
        const q = filterDate.trim();
        const qLower = q.toLowerCase();

        return list.filter((b) => {
          const bkDate = b.bookingDate || b.date;
          if (periodPreset === 'today' && bkDate !== todayStr) return false;
          if (periodPreset === '09.04.2026' && bkDate !== '09.04.2026') return false;
          if (periodPreset === '10.04.2026' && bkDate !== '10.04.2026') return false;

          if (!q) return true;
          return (
            phoneMatchesQuery(b.clientPhone, q) ||
            String(bkDate || '').toLowerCase().includes(qLower) ||
            String(b.date || '').toLowerCase().includes(qLower) ||
            String(b.model || '').toLowerCase().includes(qLower) ||
            String(b.operator || '').toLowerCase().includes(qLower) ||
            String(b.priceText || '').toLowerCase().includes(qLower) ||
            String(b.review || '').toLowerCase().includes(qLower)
          );
        });
      }, [bookings, periodPreset, filterDate, todayStr]);

      const statsAll = useMemo(() => computeCashStats(filteredBookings), [filteredBookings]);

      const selectedBookings = useMemo(
        () => filteredBookings.filter((b) => selectedIds.includes(b.id)),
        [filteredBookings, selectedIds]
      );

      const toggleSelectOne = (id) => {
        tgHaptic('light');
        setSelectedIds((prev) =>
          prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
        );
      };

      const handleSelectAllFiltered = () => {
        tgHaptic('light');
        const allFilteredIds = filteredBookings.map((b) => b.id);
        const allAlreadySelected =
          allFilteredIds.length > 0 && allFilteredIds.every((id) => selectedIds.includes(id));
        if (allAlreadySelected) {
          setSelectedIds((prev) => prev.filter((id) => !allFilteredIds.includes(id)));
        } else {
          setSelectedIds((prev) => Array.from(new Set([...prev, ...allFilteredIds])));
        }
      };

      const handleSelectToday = () => {
        tgHaptic('medium');
        const todayIds = bookings.filter((b) => (b.bookingDate || b.date) === todayStr).map((b) => b.id);
        setSelectedIds(todayIds);
        const res = computeCashStats(bookings.filter((b) => (b.bookingDate || b.date) === todayStr));
        setCalcResult({
          title: `За сегодня (${todayStr})`,
          count: res.count,
          summaryLine: res.summaryLine
        });
        notify(todayIds.length > 0 ? `Выделено за сегодня: ${todayIds.length}` : 'Записей за сегодня пока нет');
      };

      const handleCalculateSelected = () => {
        tgHaptic('success');
        const targetList = selectedBookings.length > 0 ? selectedBookings : filteredBookings;
        const label =
          selectedBookings.length > 0
            ? `Выделено записей (${selectedBookings.length})`
            : `Текущий фильтр (${filteredBookings.length})`;
        const stats = computeCashStats(targetList);
        setCalcResult({
          title: label,
          count: stats.count,
          summaryLine: stats.summaryLine
        });
      };

      const handleClearSelection = () => {
        tgHaptic('light');
        setSelectedIds([]);
        setCalcResult(null);
      };

      const handleRunImport = () => {
        const parsed = parseAccountingExportText(importRawText);
        if (!parsed.length) {
          notify('Не удалось распознать записи — проверьте формат текста');
          return;
        }
        onRunCreation('ИМПОРТ БУХГАЛТЕРИИ', `Загружаем ${parsed.length} записей в кассу...`, () => {
          onImportBookings(parsed);
          setImportRawText('');
          setShowImportBox(false);
        });
      };

      const handleSaveBooking = (e) => {
        e.preventDefault();
        if (!bModel.trim()) return;
        const parsedAmt = parseAmountFromPriceText(bPrice, null, null);
        const exactPhone = exactPhoneFromFile(bClientPhone);
        const finalBookingDate = (bBookingDate || bDate).trim() || todayFormatted();
        const record = {
          id: `bk-${Date.now()}`,
          date: bDate.trim() || finalBookingDate,
          bookingDate: finalBookingDate,
          model: bModel.trim(),
          duration: bDuration.trim(),
          priceText: bPrice.trim(),
          amountNum: parsedAmt.amount,
          currency: parsedAmt.currency,
          operator: bOperator.trim(),
          timeSlot: bTime.trim(),
          clientPhone: exactPhone,
          review: bReview.trim(),
          address: bAddress.trim()
        };
        onRunCreation('ЗАПИСЬ В КАССУ', `Фиксируем запись по модели ${record.model}...`, () => {
          onAddBooking(record);
          onCopy(generatedBookingText, 'Карточка бухгалтерии сохранена и скопирована');
        });
      };

      const generatedBookingText = useMemo(() => {
        const exactPhone = exactPhoneFromFile(bClientPhone);
        const bkDate = (bBookingDate || bDate).trim();
        return [
          `Дата: ${bDate}`,
          bkDate ? `Дата брони: ${bkDate}` : null,
          `Модель: ${bModel}`,
          `Время / длительность: ${bTime} (${bDuration})`,
          `Оплата: ${bPrice}`,
          `Оператор: ${bOperator}`,
          exactPhone ? `Номер клиента: ${exactPhone}` : null,
          bAddress.trim() ? `Адрес: ${bAddress.trim()}` : null,
          bReview.trim() ? `Детали / заметка: ${bReview.trim()}` : null
        ]
          .filter(Boolean)
          .join('\n');
      }, [bDate, bBookingDate, bModel, bDuration, bPrice, bOperator, bTime, bClientPhone, bAddress, bReview]);

      const allFilteredIds = filteredBookings.map((b) => b.id);
      const isAllFilteredSelected =
        allFilteredIds.length > 0 && allFilteredIds.every((id) => selectedIds.includes(id));

      return h('div', { className: 'grid grid-cols-1 lg:grid-cols-12 gap-6' },
        h('form', {
          onSubmit: handleSaveBooking,
          className: 'glass-panel lg:col-span-6 rounded-[8px] p-5 space-y-3'
        },
          h('div', { className: 'flex items-center justify-between gap-2 mb-2' },
            h('h2', { className: 'font-brand-brush text-base text-white uppercase' }, 'ЗАПИСЬ ВСТРЕЧИ / БУХГАЛТЕРИЯ'),
            h('button', {
              type: 'button',
              onClick: () => setShowImportBox((v) => !v),
              className: 'btn-press glass-field px-2.5 py-1 rounded-[7px] hover:border-crimson-600 text-[11px] font-semibold text-crimson-500'
            }, showImportBox ? 'Скрыть импорт' : '+ Импорт из чата')
          ),

          showImportBox && h('div', { className: 'glass-field rounded-[8px] p-3 space-y-2 border border-crimson-700/60' },
            h('p', { className: 'text-[11px] text-zinc-300 leading-snug' },
              'Вставьте фрагмент выгрузки «Бухгалтерия» (формат Дата: / Модель: / Прайс: / Оператор: / Номер клиента:):'
            ),
            h('textarea', {
              rows: '4',
              value: importRawText,
              onChange: (e) => setImportRawText(e.target.value),
              placeholder: 'Дата: 09.04.2026\nМодель: Алсу\nПродолжительность: 1ч\nПрайс: 200$\nОператор: Денни\nНомер клиента: +995 599 16 71 66',
              className: 'glass-panel w-full rounded-[7px] p-2.5 text-xs text-white placeholder-zinc-500 outline-none focus:border-crimson-600'
            }),
            h('div', { className: 'flex items-center justify-between gap-2' },
              h('button', {
                type: 'button',
                onClick: handleRunImport,
                className: 'btn-press px-3.5 py-1.5 rounded-[7px] bg-crimson-700 hover:bg-crimson-600 text-xs font-bold text-white'
              }, 'Разобрать и добавить'),
              bookings.length > 0 && h('button', {
                type: 'button',
                onClick: () => {
                  onClearBookings();
                  setSelectedIds([]);
                  setCalcResult(null);
                },
                className: 'btn-press text-[11px] text-zinc-400 hover:text-crimson-500'
              }, 'Очистить журнал')
            )
          ),

          h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-3' },
            h('div', null,
              h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Дата записи'),
              h('input', {
                type: 'text',
                value: bDate,
                onChange: (e) => setBDate(e.target.value),
                className: 'glass-field wavy-contour w-full px-3 py-2 text-sm text-white outline-none'
              })
            ),
            h('div', null,
              h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Дата брони'),
              h('input', {
                type: 'text',
                value: bBookingDate,
                onChange: (e) => setBBookingDate(e.target.value),
                placeholder: 'ДД.ММ.ГГГГ',
                className: 'glass-field wavy-contour w-full px-3 py-2 text-sm text-white outline-none'
              })
            )
          ),
          h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-3' },
            h('div', null,
              h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Имя модели'),
              h('input', {
                type: 'text',
                required: true,

                onChange: (e) => setBModel(e.target.value),

              h('input', {

            )
          ),
          h('div', { className: 'grid grid-cols-1 sm:grid-cols-3 gap-3' },
            h('div', null,
              h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Продолжительность'),
              h('input', {
                type: 'text',
                value: bDuration,
                onChange: (e) => setBDuration(e.target.value),

              h('input', {
                type: 'text',

            h('button', {

                    price: bPrice,

            h('pre', { className: 'glass-field whitespace-pre-wrap font-sans text-xs text-zinc-200 rounded-[8px] p-3 leading-relaxed' }, generatedBookingText)

          h('div', { className: 'glass-panel rounded-[8px] p-5 space-y-3' },
            h('div', { className: 'flex flex-wrap items-center justify-between gap-2' },

              h('span', { className: 'text-xs text-zinc-400' }, `Показано: ${filteredBookings.length} / ${bookings.length}`)
            ),

            h('div', { className: 'flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5' },
              [
                { id: 'all', label: 'Все записи' },
                { id: 'today', label: `Сегодня (${todayStr})` },
                { id: '09.04.2026', label: 'Бронь 09.04.2026' },

              ].map((preset) =>

              )
            ),

            h('input', {

              value: filterDate,
              onChange: (e) => setFilterDate(e.target.value),
              placeholder: 'Поиск по номеру (в точном виде или цифрам), дате брони, модели, сумме...',
              className: 'glass-field wavy-contour w-full px-3 py-2 text-xs text-white placeholder-zinc-400 outline-none'

            h('div', { className: 'glass-field rounded-[8px] p-3 space-y-2.5 border border-crimson-700/40' },

    function ShiftReportsView({ bookings, shiftReports, onAddShiftReport, onCopy, onRunCreation, notify }) {
      const [sDate, setSDate] = useState(todayFormatted());
      const [sMessages, setSMessages] = useState('0');
      const [sOrdersCount, setSOrdersCount] = useState('0');
      const [sTotal, setSTotal] = useState('0 GEL');
      const [sNotes, setSNotes] = useState('');

      const buildShiftText = (rep) => {
        const dayOrders = bookings.filter((b) => (b.bookingDate || b.date) === rep.date);
        const ordersLines =
          dayOrders.length > 0
            ? dayOrders.map(
                (o, idx) =>
                  `${idx + 1}. ${o.model} (бронь ${o.bookingDate || o.date}, ${o.duration}${o.timeSlot ? `, ${o.timeSlot}` : ''}) — ${o.priceText} [${o.operator}]`
              )
            : [`Заказов в журнале за ${rep.date}: ${rep.ordersCount}`];

        return [
          `Дата смены / брони: ${rep.date}`,
          `Кол-во соо: ${rep.messagesCount}`,
          `Заказы: ${rep.ordersCount}`,
          ...ordersLines,
          `Тотал: ${rep.totalText}`,
          rep.notes ? `Примечание: ${rep.notes}` : null
        ]
          .filter(Boolean)
          .join('\n');
      };

      const handleSaveShift = (e) => {
        e.preventDefault();
        const newRep = {
          id: `sh-${Date.now()}`,
          date: sDate.trim() || todayFormatted(),
          messagesCount: Number(sMessages) || 0,
          ordersCount: Number(sOrdersCount) || 0,
          totalText: sTotal.trim() || '0',
          notes: sNotes.trim()
        };
        onRunCreation('ОТЧЁТ ЗА СМЕНУ', `Собираем итоги за ${newRep.date}...`, () => {
          onAddShiftReport(newRep);
          onCopy(buildShiftText(newRep), 'Отчёт за смену сохранён и скопирован');
          setSNotes('');
        });
      };

      return h('div', { className: 'grid grid-cols-1 lg:grid-cols-12 gap-6' },
        h('form', {
          onSubmit: handleSaveShift,
          className: 'glass-panel lg:col-span-6 rounded-[8px] p-5 space-y-3'
        },
          h('h2', { className: 'font-brand-brush text-base text-white uppercase mb-2' }, 'СФОРМИРОВАТЬ ОТЧЁТ ЗА СМЕНУ'),
          h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-3' },
            h('div', null,
              h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Дата смены / брони'),
              h('input', {
                type: 'text',
                value: sDate,
                onChange: (e) => setSDate(e.target.value),
                className: 'glass-field w-full rounded-[8px] px-3 py-2 text-sm text-white outline-none'
              })
            ),
            h('div', null,
              h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Кол-во соо'),
              h('input', {
                type: 'number',
                value: sMessages,
                onChange: (e) => setSMessages(e.target.value),
                className: 'glass-field w-full rounded-[8px] px-3 py-2 text-sm text-white outline-none'
              })
            ),
            h('div', null,
              h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Заказы (количество)'),
              h('input', {
                type: 'number',
                value: sOrdersCount,
                onChange: (e) => setSOrdersCount(e.target.value),
                className: 'glass-field w-full rounded-[8px] px-3 py-2 text-sm text-white outline-none'
              })
            ),
            h('div', null,
              h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Тотал'),
              h('input', {
                type: 'text',
                value: sTotal,
                onChange: (e) => setSTotal(e.target.value),
                className: 'glass-field w-full rounded-[8px] px-3 py-2 text-sm text-white outline-none'
              })
            )
          ),
          h('div', null,
            h('label', { className: 'block text-xs text-zinc-400 mb-1' }, 'Примечание по смене'),
            h('textarea', {
              rows: '2',
              value: sNotes,
              onChange: (e) => setSNotes(e.target.value),
              placeholder: 'Важные детали смены...',
              className: 'glass-field w-full rounded-[8px] px-3 py-2 text-sm text-white placeholder-zinc-500 outline-none'
            })
          ),
          h('div', { className: 'flex flex-wrap gap-2.5 pt-1' },
            h('button', {
              type: 'submit',
              className: 'btn-press px-4 py-2.5 rounded-[8px] bg-crimson-700 hover:bg-crimson-600 text-white text-sm font-semibold'
            }, 'Сохранить и скопировать отчёт'),
            h('button', {
              type: 'button',
              onClick: () => {
                const previewRep = {
                  date: sDate.trim() || todayFormatted(),
                  messagesCount: Number(sMessages) || 0,
                  ordersCount: Number(sOrdersCount) || 0,
                  totalText: sTotal.trim() || '0',
                  notes: sNotes.trim()
                };
                sendPayloadToBot(
                  { type: 'shift_report', ...previewRep },
                  buildShiftText(previewRep),
                  notify
                );
              },
              className: 'btn-press glass-field px-4 py-2.5 rounded-[8px] hover:border-crimson-600 text-sm text-white font-semibold'
            }, 'Отправить отчёт в бот')
          )
        ),

        h('div', { className: 'lg:col-span-6 space-y-3' },
          h('h3', { className: 'text-sm font-bold text-white' }, 'Сохранённые отчёты смен'),
          shiftReports.length === 0
            ? h('div', { className: 'glass-panel rounded-[8px] p-5 text-xs text-zinc-400' },
                'Отчётов за смену пока нет — заполните форму слева, чтобы сохранить и скопировать итог.'
              )
            : shiftReports.map((rep) => {
                const formatted = buildShiftText(rep);
                return h('div', {
                  key: rep.id,
                  className: 'glass-panel rounded-[8px] p-4 space-y-2.5'
                },
                  h('div', { className: 'flex items-center justify-between' },
                    h('span', { className: 'text-sm font-bold text-white' }, `Смена ${rep.date}`),
                    h('button', {
                      type: 'button',
                      onClick: () => onCopy(formatted, `Отчёт за ${rep.date} скопирован`),
                      className: 'btn-press glass-field px-3 py-1 rounded-[8px] hover:border-crimson-600 text-xs text-zinc-200'
                    }, 'Копировать отчёт')
                  ),
                  h('pre', { className: 'glass-field whitespace-pre-wrap font-sans text-xs text-zinc-300 rounded-[8px] p-3 leading-relaxed' }, formatted)
                );
              })
        )
      );
    }

    // =========================================================================
    // 9. КОРНЕВОЙ КОМПОНЕНТ ПРИЛОЖЕНИЯ
    // =========================================================================
    function App() {
      const [activeTab, setActiveTab] = useState('accounting');
      const [toastMessage, setToastMessage] = useState('');
      const [creationAnim, setCreationAnim] = useState(null);
      const [tgUserLabel, setTgUserLabel] = useState('');
      const [overflowOpen, setOverflowOpen] = useState(false);
      const logoInputRef = useRef(null);

      useEffect(() => {
        if (!tg) return;
        try {
          tg.ready();
          tg.expand();
          if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#0A090A');
          if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#0A090A');
          const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
          if (u) {
            setTgUserLabel(u.username ? `@${u.username}` : u.first_name || 'TG User');
          }
        } catch (e) {}
      }, []);

      useEffect(() => {
        if (!tg || !tg.BackButton) return;
        try {
          if (activeTab !== 'home') {
            tg.BackButton.show();
            const backHandler = () => {
              tgHaptic('light');
              setActiveTab('home');
            };
            tg.BackButton.onClick(backHandler);
            return () => tg.BackButton.offClick(backHandler);
          } else {
            tg.BackButton.hide();
          }
        } catch (e) {}
      }, [activeTab]);

      const [blacklist, setBlacklist] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.blacklist)) return parsed.blacklist;
          }
        } catch (e) {}
        return INITIAL_BLACKLIST;
      });

      const [models, setModels] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.models) && parsed.models.length > 0) return parsed.models;
          }
        } catch (e) {}
        return INITIAL_MODELS;
      });

      const [operators, setOperators] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.operators) && parsed.operators.length > 0) return parsed.operators;
          }
        } catch (e) {}
        return INITIAL_OPERATORS;
      });

      const [bookings, setBookings] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.accountingSeedVersion === ACCOUNTING_SEED_VERSION && Array.isArray(parsed.bookings)) {
              return parsed.bookings;
            }
          }
        } catch (e) {}
        return INITIAL_BOOKINGS;
      });

      const [shiftReports, setShiftReports] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.shiftReports)) return parsed.shiftReports;
          }
        } catch (e) {}
        return INITIAL_SHIFT_REPORTS;
      });

      const [customLogo, setCustomLogo] = useState(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (typeof parsed.customLogo === 'string') return parsed.customLogo;
          }
        } catch (e) {}
        return '';
      });

      useEffect(() => {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              accountingSeedVersion: ACCOUNTING_SEED_VERSION,
              blacklist,
              models,
              operators,
              bookings,
              shiftReports,
              customLogo
            })
          );
        } catch (e) {
          console.warn('Не удалось сохранить состояние в localStorage:', e);
        }
      }, [blacklist, models, operators, bookings, shiftReports, customLogo]);

      const notify = (msg) => {
        setToastMessage(msg);
        window.clearTimeout(window.__tabToastTimer);
        window.__tabToastTimer = window.setTimeout(() => {
          setToastMessage('');
        }, 2300);
      };

      const runCreationSquare = (title, subtitle, callback) => {
        tgHaptic('medium');
        setCreationAnim({ title, subtitle });
        window.setTimeout(() => {
          try {
            if (typeof callback === 'function') callback();
          } finally {
            setCreationAnim(null);
            tgHaptic('success');
          }
        }, 560);
      };

      const handleCopy = (text, label = 'Скопировано') => {
        copyToClipboard(text);
        tgHaptic('light');
        notify(label);
      };

      const handleLogoFileChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          setCustomLogo(String(reader.result || ''));
          notify('Фон и эмблема обновлены');
        };
        reader.readAsDataURL(file);
      };

      const handleAddBlacklist = (entry) => {
        setBlacklist((prev) => [{ ...entry, phone: exactPhoneFromFile(entry.phone), id: `bl-${Date.now()}` }, ...prev]);
        notify('Номер добавлен в ЧС');
      };

      const handleDeleteBlacklist = (id) => {
        setBlacklist((prev) => prev.filter((item) => item.id !== id));
        tgHaptic('warning');
        notify('Запись удалена из ЧС');
      };

      const handleAddModel = (model) => {
        setModels((prev) => [...prev, model]);
        notify(`Модель ${model.name} добавлена`);
      };

      const handleUpdateModel = (updated) => {
        setModels((prev) => prev.map((m) => (m.id === updated.id ? updated : m)));
      };

      const handleDeleteModel = (id) => {
        setModels((prev) => prev.filter((m) => m.id !== id));
        notify('Карточка модели удалена');
      };

      const handleAddOperator = (op) => {
        setOperators((prev) => [...prev, { ...op, phone: exactPhoneFromFile(op.phone) }]);
        tgHaptic('success');
        notify('Номер добавлен');
      };

      const handleDeleteOperator = (id) => {
        setOperators((prev) => prev.filter((op) => op.id !== id));
        notify('Номер удалён');
      };

      const handleAddBooking = (bk) => {
        setBookings((prev) => [
          {
            ...bk,
            clientPhone: exactPhoneFromFile(bk.clientPhone),
            bookingDate: bk.bookingDate || bk.date || todayFormatted()
          },
          ...prev
        ]);
      };

      const handleAddShiftReport = (rep) => {
        setShiftReports((prev) => [rep, ...prev]);
      };

      const navItems = [
        { id: 'home', label: 'Проверка' },
        { id: 'blacklist', label: 'ЧС номера' },
        { id: 'models', label: 'Модели' },
        { id: 'operators', label: 'Команда' },
        { id: 'accounting', label: 'Бухгалтерия' },
        { id: 'shifts', label: 'Отчёты смен' },
        { id: 'rules', label: 'Правила и штрафы' }
      ];

      return h('div', { className: 'relative min-h-screen bg-obsidian text-zinc-100 flex flex-col' },
        h(AmbientBackdropPhoto, { customLogo }),
        h(CreationSquareModal, { creation: creationAnim }),
        h(ToastBanner, { message: toastMessage }),
        h(OverflowMenuModal, {
          open: overflowOpen,
          onClose: () => setOverflowOpen(false),
          bookings,
          onAddBooking: handleAddBooking,
          onCopy: handleCopy,
          onRunCreation: runCreationSquare,
          onNavigate: setActiveTab,
          onCustomLogoClick: () => logoInputRef.current && logoInputRef.current.click(),
          customLogo,
          onResetCustomLogo: () => {
            setCustomLogo('');
            notify('Возвращён фон TABU');
          }
        }),

        h('header', { className: 'sticky top-0 z-30 bg-obsidian/85 backdrop-blur-md border-b border-hairline' },
          h('div', { className: 'max-w-6xl mx-auto px-4 h-14 flex items-center justify-between gap-3' },
            h('div', { className: 'flex items-center gap-3 min-w-0' },
              h('button', {
                type: 'button',
                onClick: () => {
                  tgHaptic('light');
                  setActiveTab('home');
                },
                className: 'btn-press shrink-0'
              }, h(TabBrandLogo, { customLogo })),
              h('span', { className: 'hidden sm:inline-block text-xs text-zinc-400 border-l border-hairline pl-3 truncate' },
                'TABU • Telegram Mini App'
              ),
              tgUserLabel && h('span', { className: 'px-2 py-0.5 rounded-[6px] bg-crimson-900/50 border border-crimson-700/60 text-[11px] text-crimson-500 font-semibold truncate' },
                tgUserLabel
              )
            ),

            h('nav', { className: 'hidden md:flex items-center gap-1.5' },
              navItems.map((item) =>
                h('button', {
                  key: item.id,
                  type: 'button',
                  onClick: () => {
                    tgHaptic('light');
                    setActiveTab(item.id);
                  },
                  className: `btn-press px-3.5 py-2 rounded-[10px] text-xs font-bold transition ${
                    activeTab === item.id
                      ? 'bg-crimson-700 text-white shadow-md shadow-crimson-900/40'
                      : 'text-zinc-400 hover:text-white hover:bg-surface'
                  }`
                }, item.label)
              )
            ),

            h('div', { className: 'flex items-center gap-1.5 shrink-0' },
              h('button', {
                type: 'button',
                onClick: () => {
                  tgHaptic('medium');
                  setOverflowOpen(true);
                },
                title: 'Сводка по периодам и касса за сегодня',
                'aria-label': 'Меню операций',
                className: 'btn-press px-3 py-1.5 rounded-[8px] bg-surface border border-hairline hover:border-crimson-600 text-sm font-extrabold text-white tracking-widest flex items-center justify-center'
              }, '⋮'),
              h('input', {
                ref: logoInputRef,
                type: 'file',
                accept: 'image/*',
                onChange: handleLogoFileChange,
                className: 'hidden'
              })
            )
          )
        ),

        h('main', { className: 'relative z-10 flex-1 max-w-6xl w-full mx-auto px-4 pt-5 pb-28 md:pb-10' },
          h('div', { key: activeTab, className: 'tab-stage-enter' },
            activeTab === 'home' && h(HomeView, {
              blacklist,
              bookings,
              models,
              operators,
              onNavigate: setActiveTab,
              onCopy: handleCopy,
              onQuickAddBlacklist: handleAddBlacklist,
              onRunCreation: runCreationSquare
            }),
            activeTab === 'blacklist' && h(BlacklistView, {
              blacklist,
              onAdd: handleAddBlacklist,
              onDelete: handleDeleteBlacklist,
              onCopy: handleCopy,
              onRunCreation: runCreationSquare
            }),
            activeTab === 'models' && h(ModelsView, {
              models,
              onAddModel: handleAddModel,
              onUpdateModel: handleUpdateModel,
              onDeleteModel: handleDeleteModel,
              onCopy: handleCopy,
              onRunCreation: runCreationSquare
            }),
            activeTab === 'operators' && h(OperatorsView, {
              operators,
              onAddOperator: handleAddOperator,
              onDeleteOperator: handleDeleteOperator,
              onCopy: handleCopy
            }),
            activeTab === 'accounting' && h(AccountingView, {
              bookings,
              onAddBooking: handleAddBooking,
              onImportBookings: (importedList) => {
                setBookings((prev) => [...importedList, ...prev]);
                notify(`Добавлено записей: ${importedList.length}`);
              },
              onClearBookings: () => {
                setBookings([]);
                notify('Журнал бухгалтерии очищен');
              },
              onCopy: handleCopy,
              onRunCreation: runCreationSquare,
              notify
            }),
            activeTab === 'shifts' && h(ShiftReportsView, {
              bookings,
              shiftReports,
              onAddShiftReport: handleAddShiftReport,
              onCopy: handleCopy,
              onRunCreation: runCreationSquare,
              notify
            }),
            activeTab === 'rules' && h(RulesAndFinesView)
          )
        ),

        h('nav', { className: 'md:hidden fixed bottom-0 inset-x-0 z-30 mobile-dock-nav' },
          h('div', { className: 'flex items-stretch gap-2 px-2.5 pt-3 pb-1.5 overflow-x-auto no-scrollbar' },
            navItems.map((item) => {
              const active = activeTab === item.id;
              return h('button', {
                key: item.id,
                type: 'button',
                onClick: () => {
                  tgHaptic('medium');
                  setActiveTab(item.id);
                },
                className: `mobile-nav-btn shrink-0 min-w-[84px] min-h-[54px] py-2.5 px-3 rounded-[15px] text-[12px] font-extrabold leading-tight flex flex-col items-center justify-center text-center ${
                  active ? 'mobile-nav-btn--active' : 'mobile-nav-btn--idle'
                }`
              },
                h('span', { className: 'relative z-10 whitespace-nowrap' }, item.label),
                active && h('span', { className: 'mobile-nav-indicator relative z-10' })
              );
            })
          )
        )
      );
    }

    const rootEl = document.getElementById('root');
    ReactDOM.createRoot(rootEl).render(h(App));
  </script>
</body>
</html>
